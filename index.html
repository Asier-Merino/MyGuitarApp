<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GuitarSeo</title>
  <meta name="description" content="Teoría musical aplicada a la guitarra: notas del mástil, acordes, oído, escalas, blues y CAGED.">
  <meta name="theme-color" content="#262421">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GuitarSeo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo (oscuro por defecto).
    try {
      var saved = JSON.parse(localStorage.getItem('myguitarapp'));
      var theme = saved && saved.settings && saved.settings.theme;
      if (theme === 'light' || theme === 'dark' || theme === 'system') document.documentElement.dataset.theme = theme;
    } catch (e) { /* sin localStorage: tema oscuro */ }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="view" class="view" tabindex="-1">
    <noscript><p class="card">Esta app necesita JavaScript activado.</p></noscript>
  </main>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button type="button" class="btn btn--primary btn--small" id="update-apply">Actualizar</button>
  </div>
</body>
</html>
