<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyGuitarApp</title>
  <meta name="description" content="Teoría musical aplicada a la guitarra: notas del mástil, acordes, oído, escalas, blues y CAGED.">
  <meta name="theme-color" content="#1d272c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyGuitarApp">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
    try {
      var saved = JSON.parse(localStorage.getItem('myguitarapp'));
      var theme = saved && saved.settings && saved.settings.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) { /* sin localStorage: tema del sistema */ }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__bar">
      <a class="brand" href="#/teoria">
        <svg class="brand__icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="2" width="10" height="22" rx="1.5" fill="currentColor" opacity=".25"/>
          <rect x="7" y="4" width="10" height="1.6" fill="currentColor"/>
          <path d="M9 4v20M11 4v20M13 4v20M15 4v20" stroke="currentColor" stroke-width=".8"/>
          <circle cx="11" cy="11" r="1.8" fill="var(--fn-root)"/>
        </svg>
        <span>MyGuitarApp</span>
      </a>
      <div id="notation-switch"></div>
      <a class="icon-btn" href="#/ajustes" aria-label="Ajustes" id="settings-link">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24">
          <path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/>
        </svg>
      </a>
    </div>
    <nav class="section-tabs" aria-label="Secciones">
      <a href="#/teoria" data-section="teoria">Teoría</a>
      <a href="#/practica" data-section="practica">Práctica</a>
    </nav>
  </header>

  <div id="update-banner" class="update-banner" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button type="button" class="btn btn--small" id="update-apply">Actualizar</button>
  </div>

  <main id="view" class="view" tabindex="-1">
    <noscript><p class="card">Esta app necesita JavaScript activado.</p></noscript>
  </main>
</body>
</html>
